<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Last Drop">
  <defs>
    <linearGradient id="ld-water" x1="256" y1="96" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E7D8C"/>
      <stop offset="0.55" stop-color="#0B2730"/>
      <stop offset="1" stop-color="#06171D"/>
    </linearGradient>
    <clipPath id="ld-clip">
      <path d="M256 84c52 62 108 118 108 178 0 66-48 118-108 118s-108-52-108-118c0-60 56-116 108-178z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#F2EDE4"/>
  <rect x="24" y="24" width="464" height="464" fill="none" stroke="#101E28" stroke-width="10"/>

  <!-- shrinking pool rings -->
  <circle cx="256" cy="262" r="196" fill="none" stroke="#FF4E20" stroke-width="10" stroke-dasharray="26 20" opacity="0.85"/>
  <circle cx="256" cy="262" r="164" fill="none" stroke="#00C2D1" stroke-width="8" opacity="0.55"/>

  <!-- droplet -->
  <path d="M256 84c52 62 108 118 108 178 0 66-48 118-108 118s-108-52-108-118c0-60 56-116 108-178z" fill="url(#ld-water)" stroke="#101E28" stroke-width="12" stroke-linejoin="round"/>

  <!-- highlight + meniscus -->
  <g clip-path="url(#ld-clip)">
    <ellipse cx="212" cy="228" rx="30" ry="42" fill="#F2EDE4" opacity="0.55"/>
    <path d="M120 336c44 22 92 32 136 32s92-10 136-32v90H120z" fill="#00C2D1" opacity="0.35"/>
    <path d="M120 336c44 22 92 32 136 32s92-10 136-32" fill="none" stroke="#00C2D1" stroke-width="12"/>
  </g>
</svg>
